id: task-0005
title: 'TalentForge: webhook freshness + poll reconciliation with exactly-once'
category: build
vendor: talentforge
surfaces:
- webhooks
- polling
tier: 2
primary_mechanic: webhook_duplicate_storm_idempotency
track: python
timeout_minutes: 60
doc_profile: stale
l3_scenarios:
- duplicate_storm
scenarios:
- webhook_freshness
- reconciliation
- duplicate_storm
entry:
  command:
  - python
  - -m
  - connector
outputs:
  files:
  - output/candidates.json
vendors:
  talentforge:
    data_port: 8000
    log_path: /var/log/vendor
    checkpoint_env: CHECKPOINT
    credentials:
      TF_CLIENT_ID: tf-test-client-id
      TF_CLIENT_SECRET: tf-test-client-secret
      TF_WEBHOOK_SECRET: tf-test-webhook-secret
    auth:
      token_endpoint: /oauth/token
      token_ttl: 600
    entities:
      candidate:
        id_prefix: cand
        plural: candidates
    vendor:
      base_path: /rest
    pagination:
      style: cursor
      cursor_param: cursor
    webhooks:
      enabled: true
      signing:
        algorithm: hmac-sha256
        signature_header: X-TF-Signature
        timestamp_header: X-TF-Timestamp
        secret_env: TF_WEBHOOK_SECRET
        max_skew_s: 300
contract:
  schema_version: 1
  version: 1.0.0
  visibility: public
  lifecycle: authored
  vendor_roles:
    talentforge:
      vendor_id: talentforge
      checkpoint: 0
      required_credentials:
      - TF_CLIENT_ID
      - TF_CLIENT_SECRET
      - TF_WEBHOOK_SECRET
      api_url_env: TALENTFORGE_BASE_URL
      docs_url_env: TALENTFORGE_DOCS_URL
  runtime:
    profile: deterministic-v1
    checkpoint: 0
    limits:
      wall_seconds: 3600
      cpus: 2
      memory: 2GiB
      disk: 2GiB
    network:
      vendor_roles:
      - talentforge
      model_provider_egress: mode-dependent-allowlist
    vendor_roles:
      talentforge:
        environment:
          WEBHOOK_TARGET: http://app:4000/webhooks/talentforge
  participant:
    workspace_allowlist:
    - PROBLEM.md
    - repo/**
    - materials/**
    - inputs/**
    entry_command:
    - python
    - -m
    - connector
    outputs:
    - output/candidates.json
    persistent_state:
    - repo/output/**
    runtime_environment: {}
    persistent_mounts: []
  verifier:
    entry_command:
    - python
    - -m
    - bench.verifier
    - --task
    - .
    trusted_inputs:
    - task.yaml
    - verifier/fixtures/**
    - verifier/scenarios/**
    - vendor-logs/**
