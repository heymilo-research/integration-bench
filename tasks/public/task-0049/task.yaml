id: task-0049
title: 'Summit #2: Placemint webhooks+polling+writeback under compounding faults,
  zero lies to blame'
category: build+harden
vendor: placemint
surfaces:
- webhooks
- polling
- writeback
tier: 3
track: python
timeout_minutes: 90
doc_profile: 'true'
primary_mechanic: compounding_faults_summit
l3_scenarios:
- compounding_faults_summit
scenarios:
- webhook_freshness_clean
- poll_reconciliation_recovers_dropped_event
- writeback_under_pressure
- compounding_faults_summit
entry:
  command:
  - python
  - -m
  - placemint_summit
outputs:
  files:
  - output/placements.json
  - output/writeback_result.json
vendors:
  placemint:
    data_port: 8000
    log_path: /var/log/vendor
    checkpoint_env: CHECKPOINT
    credentials:
      PM_CLIENT_ID: pm-test-client-id
      PM_CLIENT_SECRET: pm-test-client-secret
      PM_WEBHOOK_SECRET: pm-test-webhook-secret
    auth:
      token_endpoint: /oauth/token
      token_ttl: 60
    vendor:
      base_path: /api
    pagination:
      style: offset
      offset_param: offset
    webhooks:
      enabled: true
      target: http://connector:4000/webhooks/placemint
      signing:
        algorithm: hmac-sha256
        signature_header: X-PM-Signature
        timestamp_header: X-PM-Timestamp
        secret_env: PM_WEBHOOK_SECRET
        max_skew_s: 300
    writeback:
      idempotency:
        header: Idempotency-Key
        window_s: 3600
      read_after_write_lag_s: 0
    entities:
      placement:
        id_prefix: plc
        plural: placements
      client:
        id_prefix: client
        plural: clients
      note:
        id_prefix: note
        plural: notes
contract:
  schema_version: 1
  version: 1.0.0
  visibility: public
  lifecycle: authored
  vendor_roles:
    placemint:
      vendor_id: placemint
      checkpoint: 0
      required_credentials:
      - PM_CLIENT_ID
      - PM_CLIENT_SECRET
      - PM_WEBHOOK_SECRET
      api_url_env: PLACEMINT_BASE_URL
      docs_url_env: PLACEMINT_DOCS_URL
  runtime:
    profile: deterministic-v1
    checkpoint: 0
    limits:
      wall_seconds: 5400
      cpus: 2
      memory: 2GiB
      disk: 2GiB
    network:
      vendor_roles:
      - placemint
      model_provider_egress: mode-dependent-allowlist
    vendor_roles:
      placemint:
        environment:
          DATASET_SIZE: '200'
          PM_TOKEN_TTL_S: '60'
          WEBHOOK_TARGET: http://connector:4000/webhooks/placemint
          FAULT_5XX_ON_PAGE: ''
          FAULT_TOKEN_EXPIRY_MIDRUN: '0'
          FAULT_DUP_STORM: '0'
          FAULT_DROP_EVENT_IDS: ''
          TAMPER_INJECT: '0'
  participant:
    workspace_allowlist:
    - PROBLEM.md
    - repo/**
    - materials/**
    - inputs/**
    entry_command:
    - python
    - -m
    - placemint_summit
    outputs:
    - output/placements.json
    - output/writeback_result.json
    persistent_state:
    - repo/output/**
    runtime_environment:
      POLL_INTERVAL_S: '3'
    persistent_mounts:
    - app-state:/app/state
  verifier:
    entry_command:
    - python
    - -m
    - bench.verifier
    - --task
    - .
    trusted_inputs:
    - task.yaml
    - verifier/fixtures/**
    - verifier/scenarios/**
    - vendor-logs/**
