[project]
name = "placemint-summit"
version = "0.1.0"
description = "Placemint webhooks+polling+writeback connector under compounding faults (task-0049)"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
placemint-summit = "placemint_summit.cli:_entrypoint"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
