id: task-0045
title: 'Cross-vendor migration: StaffLine to Bullpen v2, replatforming canonical store
  + writeback'
primary_mechanic: post_cutover_write_routing_exclusivity
category: migrate
vendor: bullpen
surfaces:
- polling
- writeback
tier: 3
track: python
timeout_minutes: 60
doc_profile: stale
scenarios:
- legacy_baseline_from_staffline
- cutover_backfill_to_bullpen
- writeback_lands_on_new_vendor
entry:
  command:
  - python
  - -m
  - staffline_to_bullpen_migrate
outputs:
  files:
  - output/candidates.json
  - output/jobs.json
  - output/applications.json
  - output/writeback_result.json
vendors:
  vendor-legacy:
    data_port: 8000
    log_path: /var/log/vendor
    checkpoint_env: CHECKPOINT
    credentials:
      SL_APP_TOKEN: sl-test-app-token
      SL_HMAC_SECRET: sl-test-hmac-secret
    vendor:
      base_path: /svc
    pagination:
      style: offset
      offset_param: start
    writeback: {}
    entities:
      candidate:
        plural: candidates
      job:
        plural: jobs
      application:
        plural: applications
      note:
        plural: notes
  vendor-new:
    data_port: 8000
    log_path: /var/log/vendor
    checkpoint_env: CHECKPOINT
    credentials:
      BP_CLIENT_ID: bp-test-client-id
      BP_CLIENT_SECRET: bp-test-client-secret
    auth:
      token_endpoint: /oauth/token
      token_ttl: 300
    vendor:
      base_path: /v2
    pagination:
      style: cursor
      cursor_param: cursor
    writeback: {}
    entities:
      candidate:
        plural: candidates
      job:
        plural: jobs
      application:
        plural: applications
contract:
  schema_version: 1
  version: 1.0.0
  visibility: public
  lifecycle: authored
  vendor_roles:
    vendor-legacy:
      vendor_id: staffline
      checkpoint: 0
      required_credentials:
      - SL_APP_TOKEN
      - SL_HMAC_SECRET
      api_url_env: VENDOR_LEGACY_BASE_URL
      docs_url_env: VENDOR_LEGACY_DOCS_URL
    vendor-new:
      vendor_id: bullpen
      checkpoint: 0
      required_credentials:
      - BP_CLIENT_ID
      - BP_CLIENT_SECRET
      api_url_env: VENDOR_NEW_BASE_URL
      docs_url_env: VENDOR_NEW_DOCS_URL
  runtime:
    profile: deterministic-v1
    checkpoint: 0
    limits:
      wall_seconds: 3600
      cpus: 2
      memory: 2GiB
      disk: 2GiB
    network:
      vendor_roles:
      - vendor-legacy
      - vendor-new
      model_provider_egress: mode-dependent-allowlist
    vendor_roles:
      vendor-legacy:
        environment: {}
      vendor-new:
        environment:
          BP_APP_TOKEN: bp-test-app-token
  participant:
    workspace_allowlist:
    - PROBLEM.md
    - repo/**
    - materials/**
    - inputs/**
    entry_command:
    - python
    - -m
    - staffline_to_bullpen_migrate
    outputs:
    - output/candidates.json
    - output/jobs.json
    - output/applications.json
    - output/writeback_result.json
    persistent_state:
    - repo/output/**
    runtime_environment: {}
    persistent_mounts: []
  verifier:
    entry_command:
    - python
    - -m
    - bench.verifier
    - --task
    - .
    trusted_inputs:
    - task.yaml
    - verifier/fixtures/**
    - verifier/scenarios/**
    - vendor-logs/**
