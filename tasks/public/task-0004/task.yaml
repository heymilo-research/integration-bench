id: task-0004
title: Merge StaffLine application stage with Placemint placement stage by role-based
  precedence
category: build
vendor: staffline
primary_mechanic: precedence_reconciliation_lag
surfaces:
- polling
- writeback
tier: 3
track: python
timeout_minutes: 60
doc_profile: sparse
scenarios:
- merge_baseline
- disputed_precedence_reconciliation
- invalid_ref_exclusion
- correction_writeback
entry:
  command:
  - python
  - -m
  - staffline_placemint_merge
outputs:
  files:
  - output/roster.json
  - output/corrections.json
vendors:
  staffline:
    data_port: 8000
    log_path: /var/log/vendor
    checkpoint_env: CHECKPOINT
    credentials:
      SL_APP_TOKEN: sl-test-app-token
      SL_HMAC_SECRET: sl-test-hmac-secret
    vendor:
      base_path: /svc
    pagination:
      style: offset
      offset_param: start
      limit_param: count
    webhooks:
      enabled: false
    writeback: {}
    entities:
      candidate:
        plural: candidates
      job:
        plural: jobs
      application:
        plural: applications
      note:
        plural: notes
  placemint:
    data_port: 8000
    log_path: /var/log/vendor
    checkpoint_env: CHECKPOINT
    credentials:
      PM_CLIENT_ID: pm-test-client-id
      PM_CLIENT_SECRET: pm-test-client-secret
    auth:
      token_endpoint: /oauth/token
      token_ttl: 60
    vendor:
      base_path: /api
    pagination:
      style: offset
      offset_param: offset
      limit_param: limit
    entities:
      placement:
        plural: placements
      client:
        plural: clients
      note:
        plural: notes
contract:
  schema_version: 1
  version: 1.0.0
  visibility: public
  lifecycle: authored
  vendor_roles:
    staffline:
      vendor_id: staffline
      checkpoint: 0
      required_credentials:
      - SL_APP_TOKEN
      - SL_HMAC_SECRET
      api_url_env: STAFFLINE_BASE_URL
      docs_url_env: STAFFLINE_DOCS_URL
    placemint:
      vendor_id: placemint
      checkpoint: 0
      required_credentials:
      - PM_CLIENT_ID
      - PM_CLIENT_SECRET
      api_url_env: PLACEMINT_BASE_URL
      docs_url_env: PLACEMINT_DOCS_URL
  runtime:
    profile: deterministic-v1
    checkpoint: 0
    limits:
      wall_seconds: 3600
      cpus: 2
      memory: 2GiB
      disk: 2GiB
    network:
      vendor_roles:
      - placemint
      - staffline
      model_provider_egress: mode-dependent-allowlist
    vendor_roles:
      staffline:
        environment: {}
      placemint:
        environment:
          VENDOR_SEED: '5090'
          DATASET_SIZE: '400'
  participant:
    workspace_allowlist:
    - PROBLEM.md
    - repo/**
    - materials/**
    - inputs/**
    entry_command:
    - python
    - -m
    - staffline_placemint_merge
    outputs:
    - output/roster.json
    - output/corrections.json
    persistent_state:
    - repo/output/**
    runtime_environment: {}
    persistent_mounts: []
  verifier:
    entry_command:
    - python
    - -m
    - bench.verifier
    - --task
    - .
    trusted_inputs:
    - task.yaml
    - verifier/fixtures/**
    - verifier/scenarios/**
    - vendor-logs/**
