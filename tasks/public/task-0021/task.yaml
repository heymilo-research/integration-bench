id: task-0021
title: 'GlobalHire: sync candidates/placements/agencies where v2 fixes v1''s silent
  candidate truncation but is itself unconditionally broken for placements'
category: build
vendor: globalhire
surfaces:
- polling
tier: 3
primary_mechanic: split_brain_dual_versions
track: python
timeout_minutes: 60
doc_profile: stale
scenarios:
- version_discovery
- truncation_parity
- rpc_lie_avoidance
- split_brain_composition
entry:
  command:
  - python
  - -m
  - globalhire_sync
outputs:
  files:
  - output/candidates.json
  - output/placements.json
  - output/agencies.json
vendors:
  globalhire:
    data_port: 8000
    log_path: /var/log/vendor
    checkpoint_env: CHECKPOINT
    credentials:
      GH_API_KEY: gh-test-api-key
    vendor:
      base_path: /v1
    pagination:
      style: offset
      offset_param: offset
      limit_param: limit
    webhooks:
      enabled: false
    writeback:
      endpoints: []
    entities:
      candidate:
        plural: candidates
      placement:
        plural: placements
      agency:
        plural: agencies
contract:
  schema_version: 1
  version: 1.0.0
  visibility: public
  lifecycle: authored
  vendor_roles:
    globalhire:
      vendor_id: globalhire
      checkpoint: 0
      required_credentials:
      - GH_API_KEY
      api_url_env: GLOBALHIRE_BASE_URL
      docs_url_env: GLOBALHIRE_DOCS_URL
  runtime:
    profile: deterministic-v1
    checkpoint: 0
    limits:
      wall_seconds: 3600
      cpus: 2
      memory: 2GiB
      disk: 2GiB
    network:
      vendor_roles:
      - globalhire
      model_provider_egress: mode-dependent-allowlist
    vendor_roles:
      globalhire:
        environment:
          VENDOR_SEED: '5000'
          GH_V2_ENABLED: '1'
          GH_V1_TRUNCATE: candidates:100
          GH_V2_RPC_COLLECTION: placements
  participant:
    workspace_allowlist:
    - PROBLEM.md
    - repo/**
    - materials/**
    - inputs/**
    entry_command:
    - python
    - -m
    - globalhire_sync
    outputs:
    - output/candidates.json
    - output/placements.json
    - output/agencies.json
    persistent_state:
    - repo/output/**
    runtime_environment: {}
    persistent_mounts: []
  verifier:
    entry_command:
    - python
    - -m
    - bench.verifier
    - --task
    - .
    trusted_inputs:
    - task.yaml
    - verifier/fixtures/**
    - verifier/scenarios/**
    - vendor-logs/**
