[project]
name = "staffline-fullsync"
version = "0.1.0"
description = "Full-sync + RPC writeback connector for the StaffLine legacy staffing ATS"
requires-python = ">=3.11"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
staffline-fullsync = "staffline_fullsync.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
