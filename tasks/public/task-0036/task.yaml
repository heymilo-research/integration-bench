id: task-0036
title: Harden the Placemint book extract before it goes to the larger tenant
category: harden
vendor: placemint
surfaces:
- polling
tier: 3
primary_mechanic: stale_account_snapshot_authority
track: python
timeout_minutes: 60
doc_profile: 'true'
scenarios:
- billing_book_account_authority
l3_scenarios: []
entry:
  command:
  - python
  - -m
  - placemint_book_extract
  - extract
outputs:
  files:
  - output/book_extract.json
vendors:
  placemint:
    data_port: 8000
    log_path: /var/log/vendor
    checkpoint_env: CHECKPOINT
    credentials:
      PM_CLIENT_ID: placemint-test-client_id
      PM_CLIENT_SECRET: placemint-test-client_secret
    auth:
      token_endpoint: /oauth/token
      token_ttl: 60
    vendor:
      base_path: /api
    pagination:
      style: offset
      offset_param: offset
      limit_param: limit
      total_in_response: true
    entities:
      placement:
        id_prefix: plc
        plural: placements
      client:
        id_prefix: client
        plural: clients
status: authored
contract:
  schema_version: 1
  version: 1.0.0
  visibility: public
  lifecycle: authored
  vendor_roles:
    placemint:
      vendor_id: placemint
      checkpoint: 26
      required_credentials:
      - PM_CLIENT_ID
      - PM_CLIENT_SECRET
      api_url_env: PLACEMINT_BASE_URL
      docs_url_env: PLACEMINT_DOCS_URL
  runtime:
    profile: deterministic-v1
    checkpoint: 26
    limits:
      wall_seconds: 3600
      cpus: 2
      memory: 2GiB
      disk: 2GiB
    network:
      vendor_roles:
      - placemint
      model_provider_egress: mode-dependent-allowlist
    vendor_roles:
      placemint:
        environment:
          DATASET_SIZE: '400'
  participant:
    workspace_allowlist:
    - PROBLEM.md
    - repo/**
    - materials/**
    - inputs/**
    entry_command:
    - python
    - -m
    - placemint_book_extract
    - extract
    outputs:
    - output/book_extract.json
    persistent_state:
    - repo/output/**
    runtime_environment:
      ACCOUNT_BOOK_FILE: /app/input/account_book.json
    persistent_mounts: []
  verifier:
    entry_command:
    - python
    - -m
    - bench.verifier
    - --task
    - .
    trusted_inputs:
    - task.yaml
    - verifier/fixtures/**
    - verifier/scenarios/**
    - vendor-logs/**
