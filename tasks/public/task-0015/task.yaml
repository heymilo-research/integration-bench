id: task-0015
title: 'StaffLine: bulk candidate import via the new 207 multi-status endpoint — one
  reported success never lands'
category: build
vendor: staffline
surfaces:
- writeback
- polling
tier: 3
primary_mechanic: multi_status_207_lying_success
track: python
timeout_minutes: 60
doc_profile: sparse
scenarios:
- bulk_ingest_mixed_results
- lying_success_reconcile
- retry_and_dedupe
entry:
  command:
  - python
  - -m
  - staffline_bulk
outputs:
  files:
  - output/bulk_result.json
vendors:
  staffline:
    data_port: 8000
    log_path: /var/log/vendor
    checkpoint_env: CHECKPOINT
    credentials:
      SL_APP_TOKEN: sl-test-app-token
      SL_HMAC_SECRET: sl-test-hmac-secret
    entities:
      candidate:
        id_prefix: cand
        plural: candidates
    vendor:
      base_path: /svc
    pagination:
      style: offset
      offset_param: start
contract:
  schema_version: 1
  version: 1.0.0
  visibility: public
  lifecycle: authored
  vendor_roles:
    staffline:
      vendor_id: staffline
      checkpoint: 0
      required_credentials:
      - SL_APP_TOKEN
      - SL_HMAC_SECRET
      api_url_env: STAFFLINE_BASE_URL
      docs_url_env: STAFFLINE_DOCS_URL
  runtime:
    profile: deterministic-v1
    checkpoint: 0
    limits:
      wall_seconds: 3600
      cpus: 2
      memory: 2GiB
      disk: 2GiB
    network:
      vendor_roles:
      - staffline
      model_provider_egress: mode-dependent-allowlist
    vendor_roles:
      staffline:
        environment:
          SL_BULK_ENABLED: '1'
  participant:
    workspace_allowlist:
    - PROBLEM.md
    - repo/**
    - materials/**
    - inputs/**
    entry_command:
    - python
    - -m
    - staffline_bulk
    outputs:
    - output/bulk_result.json
    persistent_state:
    - repo/output/**
    runtime_environment:
      INPUT_FILE: /app/input/candidate_batch.json
    persistent_mounts: []
  verifier:
    entry_command:
    - python
    - -m
    - bench.verifier
    - --task
    - .
    trusted_inputs:
    - task.yaml
    - verifier/fixtures/**
    - verifier/scenarios/**
    - vendor-logs/**
