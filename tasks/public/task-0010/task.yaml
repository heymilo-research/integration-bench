id: task-0010
title: Ledger GlobalHire activity into Compliance's audit periods
category: build
vendor: globalhire
surfaces:
- polling
tier: 2
primary_mechanic: time_window_chunked_queries
track: python
timeout_minutes: 60
doc_profile: stale
scenarios:
- window_bounded_activity_ledger
l3_scenarios: []
entry:
  command:
  - python
  - -m
  - gh_activity_ledger
outputs:
  files:
  - output/result.json
  - output/activity_ledger.csv
vendors:
  globalhire:
    data_port: 8000
    log_path: /var/log/vendor
    checkpoint_env: CHECKPOINT
    credentials:
      GH_API_KEY: globalhire-test-key
    vendor:
      base_path: /v1
    entities:
      candidate:
        plural: candidates
      placement:
        plural: placements
      agency:
        plural: agencies
    pagination:
      style: offset
      page_param: offset
      per_page_param: limit
      incremental_params:
      - modified_since
status: authored
contract:
  schema_version: 1
  version: 1.0.0
  visibility: public
  lifecycle: authored
  vendor_roles:
    globalhire:
      vendor_id: globalhire
      checkpoint: 60
      required_credentials:
      - GH_API_KEY
      api_url_env: GLOBALHIRE_BASE_URL
      docs_url_env: GLOBALHIRE_DOCS_URL
  runtime:
    profile: deterministic-v1
    checkpoint: 60
    limits:
      wall_seconds: 3600
      cpus: 2
      memory: 2GiB
      disk: 2GiB
    network:
      vendor_roles:
      - globalhire
      model_provider_egress: mode-dependent-allowlist
    vendor_roles:
      globalhire:
        environment:
          FAULT_5XX_ON_PAGE: ''
          FAULT_RATE_LIMIT: '0'
  participant:
    workspace_allowlist:
    - PROBLEM.md
    - repo/**
    - materials/**
    - inputs/**
    entry_command:
    - python
    - -m
    - gh_activity_ledger
    outputs:
    - output/result.json
    - output/activity_ledger.csv
    persistent_state:
    - repo/output/**
    runtime_environment: {}
    persistent_mounts: []
  verifier:
    entry_command:
    - python
    - -m
    - bench.verifier
    - --task
    - .
    trusted_inputs:
    - task.yaml
    - verifier/fixtures/**
    - verifier/scenarios/**
    - vendor-logs/**
