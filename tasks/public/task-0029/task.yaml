id: task-0029
title: Collapse the agency signup file before it reaches CrewCall
category: build
vendor: crewcall
surfaces:
- polling
- writeback
tier: 2
primary_mechanic: intra_file_dedupe_canonicalize
track: python
timeout_minutes: 60
doc_profile: 'true'
scenarios:
- intra_file_dedupe_signup_import
l3_scenarios: []
entry:
  command:
  - python
  - -m
  - crewcall_signup_import
  - import-signups
outputs:
  files:
  - output/dedupe_report.json
vendors:
  crewcall:
    data_port: 8000
    log_path: /var/log/vendor
    checkpoint_env: CHECKPOINT
    credentials:
      CC_API_KEY: crewcall-test-key
    vendor:
      base_path: /v1
    entities:
      worker:
        plural: workers
      gig:
        plural: gigs
      assignment:
        plural: assignments
    pagination:
      style: offset
      offset_param: offset
      limit_param: limit
      total_in_response: false
    writeback:
      endpoints:
      - method: POST
        path: /v1/workers
        entity: worker
status: authored
contract:
  schema_version: 1
  version: 1.0.0
  visibility: public
  lifecycle: authored
  vendor_roles:
    crewcall:
      vendor_id: crewcall
      checkpoint: 1
      required_credentials:
      - CC_API_KEY
      api_url_env: CREWCALL_BASE_URL
      docs_url_env: CREWCALL_DOCS_URL
  runtime:
    profile: deterministic-v1
    checkpoint: 1
    limits:
      wall_seconds: 3600
      cpus: 2
      memory: 2GiB
      disk: 2GiB
    network:
      vendor_roles:
      - crewcall
      model_provider_egress: mode-dependent-allowlist
    vendor_roles:
      crewcall:
        environment: {}
  participant:
    workspace_allowlist:
    - PROBLEM.md
    - repo/**
    - materials/**
    - inputs/**
    entry_command:
    - python
    - -m
    - crewcall_signup_import
    - import-signups
    outputs:
    - output/dedupe_report.json
    persistent_state:
    - repo/output/**
    runtime_environment:
      INPUT_FILE: /app/input/signups.csv
    persistent_mounts: []
  verifier:
    entry_command:
    - python
    - -m
    - bench.verifier
    - --task
    - .
    trusted_inputs:
    - task.yaml
    - verifier/fixtures/**
    - verifier/scenarios/**
    - vendor-logs/**
