id: task-0044
title: Nightly roster census disagrees with CrewCall about who works here
category: fix
vendor: crewcall
surfaces:
- polling
tier: 3
primary_mechanic: slow_count_divergence_churn_dupes
track: python
timeout_minutes: 60
doc_profile: 'true'
scenarios:
- census_composition_under_roster_churn
l3_scenarios: []
entry:
  command:
  - python
  - -m
  - fenmarsh_census
outputs:
  files:
  - output/roster_census.csv
  - output/census_summary.json
vendors:
