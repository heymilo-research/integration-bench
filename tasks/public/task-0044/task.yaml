      base_path: /v1
    entities:
      worker:
        plural: workers
      gig:
        plural: gigs
      assignment:
        plural: assignments
    pagination:
      style: offset
      offset_param: offset
      limit_param: limit
      total_in_response: false
status: authored
contract:
  schema_version: 1
  version: 1.0.0
  visibility: public
  lifecycle: authored
  vendor_roles:
    crewcall:
      vendor_id: crewcall
      checkpoint: 88
      required_credentials:
      - CC_API_KEY
      api_url_env: CREWCALL_BASE_URL
      docs_url_env: CREWCALL_DOCS_URL
  runtime:
    profile: deterministic-v1
    checkpoint: 88
    limits:
      wall_seconds: 3600
      cpus: 2
      memory: 2GiB
      disk: 2GiB
    network:
