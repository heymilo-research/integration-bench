[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "interviewly-relay"
version = "0.1.0"
description = "Interviewly webhooks connector for Integration-Bench"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
interviewly_relay = "interviewly_relay.cli:_entrypoint"

[tool.setuptools.packages.find]
where = ["src"]
