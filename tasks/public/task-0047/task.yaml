id: task-0047
title: Reconcile and safely apply the mobility stage repair queue
category: harden
vendor: globalhire
surfaces:
- polling
- writeback
tier: 3
primary_mechanic: cache_revalidated_join_then_adaptive_batch_write
track: python
timeout_minutes: 60
doc_profile: stale
scenarios:
- mobility_stage_repair
l3_scenarios: []
entry:
  command:
  - python
  - -m
  - globalhire_mobility
outputs:
  files:
  - output/reconciliation.json
  - output/reconciliation.csv
vendors:
  globalhire:
    data_port: 8000
    log_path: /var/log/vendor
    checkpoint_env: CHECKPOINT
    credentials:
      GH_API_KEY: globalhire-test-key
    vendor:
      base_path: /v1
    entities:
      candidate:
        plural: candidates
      placement:
        plural: placements
      agency:
        plural: agencies
status: authored
contract:
  schema_version: 1
  version: 1.0.0
  visibility: public
  lifecycle: authored
  vendor_roles:
    globalhire:
      vendor_id: globalhire
      checkpoint: 1
      required_credentials:
      - GH_API_KEY
      api_url_env: GLOBALHIRE_BASE_URL
      docs_url_env: GLOBALHIRE_DOCS_URL
  runtime:
    profile: deterministic-v1
    checkpoint: 1
    limits:
      wall_seconds: 3600
      cpus: 2
      memory: 2GiB
      disk: 2GiB
    network:
      vendor_roles:
      - globalhire
      model_provider_egress: mode-dependent-allowlist
    vendor_roles:
      globalhire:
        environment:
          FAULT_CACHE_CONTROL_STALE_SERVE: '1'
          FAULT_PAYLOAD_413_SPLIT_WRITES: '1'
  participant:
    workspace_allowlist:
    - PROBLEM.md
    - repo/**
    - materials/**
    - inputs/**
    entry_command:
    - python
    - -m
    - globalhire_mobility
    outputs:
    - output/reconciliation.json
    - output/reconciliation.csv
    persistent_state:
    - repo/output/**
    runtime_environment:
      INPUT_FILE: /app/input/mobility_actions.csv
    persistent_mounts: []
  verifier:
    entry_command:
    - python
    - -m
    - bench.verifier
    - --task
    - .
    trusted_inputs:
    - task.yaml
    - verifier/fixtures/**
    - verifier/scenarios/**
    - vendor-logs/**
