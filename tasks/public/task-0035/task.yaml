id: task-0035
title: 'Vettly: backfill check reports through single-use refresh rotation and the
  absolute-expiry lie'
category: build
vendor: vettly
surfaces:
- polling
tier: 2
primary_mechanic: absolute_refresh_expiry_doc_lie
track: python
timeout_minutes: 60
doc_profile: stale
scenarios:
- initial_backfill
- incremental
entry:
  command:
  - python
  - -m
  - vettly_sync
outputs:
  files:
  - output/subjects.json
  - output/checks.json
  - output/reports.json
vendors:
  vettly:
    data_port: 8000
    log_path: /var/log/vendor
    checkpoint_env: CHECKPOINT
    credentials:
      VT_CLIENT_ID: vt-test-client-id
      VT_CLIENT_SECRET: vt-test-client-secret
    auth:
      token_endpoint: /oauth/token
      token_ttl: 120
    entities:
      subject:
        id_prefix: sub
        plural: subjects
      check:
        id_prefix: chk
        plural: checks
      report:
        id_prefix: rpt
        plural: reports
    vendor:
      base_path: /v1
    pagination:
      style: cursor
      cursor_param: cursor
    webhooks:
      enabled: false
    writeback:
      endpoints: []
contract:
  schema_version: 1
  version: 1.0.0
  visibility: public
  lifecycle: authored
  vendor_roles:
    vettly:
      vendor_id: vettly
      checkpoint: 0
      required_credentials:
      - VT_CLIENT_ID
      - VT_CLIENT_SECRET
      api_url_env: VETTLY_BASE_URL
      docs_url_env: VETTLY_DOCS_URL
  runtime:
    profile: deterministic-v1
    checkpoint: 0
    limits:
      wall_seconds: 3600
      cpus: 2
      memory: 2GiB
      disk: 2GiB
    network:
      vendor_roles:
      - vettly
      model_provider_egress: mode-dependent-allowlist
    vendor_roles:
      vettly:
        environment: {}
  participant:
    workspace_allowlist:
    - PROBLEM.md
    - repo/**
    - materials/**
    - inputs/**
    entry_command:
    - python
    - -m
    - vettly_sync
    outputs:
    - output/subjects.json
    - output/checks.json
    - output/reports.json
    persistent_state:
    - repo/output/**
    runtime_environment: {}
    persistent_mounts: []
  verifier:
    entry_command:
    - python
    - -m
    - bench.verifier
    - --task
    - .
    trusted_inputs:
    - task.yaml
    - verifier/fixtures/**
    - verifier/scenarios/**
    - vendor-logs/**
