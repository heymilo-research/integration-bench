id: task-0012
title: 'TalentLoop Summit #1: webhooks+polling+writeback under combined faults — exactly-once
  end to end, dropped delete reconciled via 410'
category: harden
vendor: talentloop
surfaces:
- webhooks
- polling
- writeback
tier: 3
primary_mechanic: dropped_delete_reconcile
track: python
timeout_minutes: 60
doc_profile: stale
l3_scenarios:
- dropped_delete_reconcile
- reconcile_after_multi_drop
- writeback_exactly_once_under_faults
scenarios:
- webhook_and_poll_freshness
- dropped_delete_reconcile
- reconcile_after_multi_drop
- writeback_exactly_once_under_faults
entry:
  command:
  - python
  - -m
  - talentloop_summit
outputs:
  files:
  - output/candidates.json
  - output/jobs.json
  - output/applications.json
  - output/notes.json
  - output/writeback_result.json
vendors:
  talentloop:
    data_port: 8000
    log_path: /var/log/vendor
    checkpoint_env: CHECKPOINT
    credentials:
      TL_CLIENT_ID: tl-test-client-id
      TL_CLIENT_SECRET: tl-test-client-secret
      TL_WEBHOOK_SECRET: tl-test-webhook-secret
    auth:
      token_endpoint: /token
      token_ttl: 3600
    vendor:
      base_path: ''
    entities:
      candidate:
        plural: candidates
      job:
        plural: jobs
      application:
        plural: applications
      note:
        plural: notes
    pagination:
      style: cursor
      cursor_param: cursor
    webhooks:
      enabled: true
      signing:
        algorithm: hmac-sha256
        signature_header: X-TL-Signature
        timestamp_header: X-TL-Timestamp
        secret_env: TL_WEBHOOK_SECRET
        max_skew_s: 300
    writeback:
      idempotency:
        header: Idempotency-Key
        window_s: 3600
      read_after_write_lag_s: 20
contract:
  schema_version: 1
  version: 1.0.0
  visibility: public
  lifecycle: authored
  vendor_roles:
    talentloop:
      vendor_id: talentloop
      checkpoint: 0
      required_credentials:
      - TL_CLIENT_ID
      - TL_CLIENT_SECRET
      - TL_WEBHOOK_SECRET
      api_url_env: TALENTLOOP_BASE_URL
      docs_url_env: TALENTLOOP_DOCS_URL
  runtime:
    profile: deterministic-v1
    checkpoint: 0
    limits:
      wall_seconds: 3600
      cpus: 2
      memory: 2GiB
      disk: 2GiB
    network:
      vendor_roles:
      - talentloop
      model_provider_egress: mode-dependent-allowlist
    vendor_roles:
      talentloop:
        environment:
          WEBHOOK_TARGET: http://connector:4000/webhooks/talentloop
          FAULT_DROP_EVENT_IDS: ''
          FAULT_DUP_STORM: '0'
          FAULT_DUP_STORM_N: '4'
          FAULT_5XX_ON_PAGE: ''
          FAULT_TOKEN_EXPIRY_MIDRUN: '0'
          TAMPER_INJECT: '1'
  participant:
    workspace_allowlist:
    - PROBLEM.md
    - repo/**
    - materials/**
    - inputs/**
    entry_command:
    - python
    - -m
    - talentloop_summit
    outputs:
    - output/candidates.json
    - output/jobs.json
    - output/applications.json
    - output/notes.json
    - output/writeback_result.json
    persistent_state:
    - repo/output/**
    runtime_environment:
      INPUT_FILE: /app/input/pending_writeback.json
    persistent_mounts: []
  verifier:
    entry_command:
    - python
    - -m
    - bench.verifier
    - --task
    - .
    trusted_inputs:
    - task.yaml
    - verifier/fixtures/**
    - verifier/scenarios/**
    - vendor-logs/**
