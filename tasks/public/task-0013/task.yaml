id: task-0013
title: The warehouse and RecruitOS have been out of step for months
category: harden
vendor: recruitos
surfaces:
- polling
- webhooks
tier: 3
primary_mechanic: parity_probe_targeted_repair
track: python
timeout_minutes: 60
doc_profile: 'true'
scenarios:
- parity_probe_targeted_repair
l3_scenarios: []
entry:
  command:
  - python
  - -m
  - harbour_parity_probe
outputs:
  files:
  - output/result.json
  - output/import_report.csv
  - output/events.json
vendors:
  recruitos:
    data_port: 8000
    log_path: /var/log/vendor
    checkpoint_env: CHECKPOINT
    credentials:
      RO_CLIENT_ID: recruitos-test-client_id
      RO_CLIENT_SECRET: recruitos-test-client_secret
      RO_WEBHOOK_SECRET: ro-test-webhook-secret
    auth:
      token_endpoint: /oauth/token
      token_ttl: 3600
    vendor:
      base_path: /api
    entities:
      candidate:
        plural: candidates
      job:
        plural: jobs
      application:
        plural: applications
    pagination:
      style: offset
      offset_param: offset
      limit_param: limit
      total_in_response: true
      incremental_params:
      - modified_since
    webhooks:
      enabled: true
      signing:
        algorithm: hmac-sha256
        signature_header: X-ROS-Signature
        timestamp_header: X-ROS-Timestamp
        secret_env: RO_WEBHOOK_SECRET
        max_skew_s: 300
status: authored
contract:
  schema_version: 1
  version: 1.0.0
  visibility: public
  lifecycle: authored
  vendor_roles:
    recruitos:
      vendor_id: recruitos
      checkpoint: 53
      required_credentials:
      - RO_CLIENT_ID
      - RO_CLIENT_SECRET
      - RO_WEBHOOK_SECRET
      api_url_env: RECRUITOS_BASE_URL
      docs_url_env: RECRUITOS_DOCS_URL
  runtime:
    profile: deterministic-v1
    checkpoint: 53
    limits:
      wall_seconds: 3600
      cpus: 2
      memory: 2GiB
      disk: 2GiB
    network:
      vendor_roles:
      - recruitos
      model_provider_egress: mode-dependent-allowlist
    vendor_roles:
      recruitos:
        environment:
          WEBHOOK_TARGET: http://connector:4000/webhooks/recruitos
          TAMPER_INJECT: '1'
  participant:
    workspace_allowlist:
    - PROBLEM.md
    - repo/**
    - materials/**
    - inputs/**
    entry_command:
    - python
    - -m
    - harbour_parity_probe
    outputs:
    - output/result.json
    - output/import_report.csv
    - output/events.json
    persistent_state:
    - repo/output/**
    runtime_environment:
      SNAPSHOT_FILE: /app/input/warehouse_mirror.json
      STATE_DIR: /app/state
    persistent_mounts:
    - app-state:/app/state
  verifier:
    entry_command:
    - python
    - -m
    - bench.verifier
    - --task
    - .
    trusted_inputs:
    - task.yaml
    - verifier/fixtures/**
    - verifier/scenarios/**
    - vendor-logs/**
