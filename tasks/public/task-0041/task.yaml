id: task-0041
title: 'Paygrade: employee/assignment RPC sync with tombstone-only deletes and 200-status
  write errors'
category: build
vendor: paygrade
surfaces:
- polling
- writeback
tier: 2
primary_mechanic: unified_rpc_gateway_reads_and_writes
track: python
timeout_minutes: 60
doc_profile: sparse
scenarios:
- initial_sync
- tombstone_sweep
- writeback_rpc_errors
entry:
  command:
  - python
  - -m
  - paygrade_sync
outputs:
  files:
  - output/employees.json
  - output/assignments.json
  - output/writeback_result.json
vendors:
  paygrade:
    data_port: 8000
    log_path: /var/log/vendor
    checkpoint_env: CHECKPOINT
    credentials:
      PG_APP_TOKEN: pg-test-app-token
    entities:
      employee:
        id_prefix: emp
        plural: employees
      assignment:
        id_prefix: asg
        plural: assignments
    vendor:
      base_path: /api/rpc
    pagination:
      style: offset
      offset_param: start
      limit_param: count
    writeback:
      idempotency:
        body_param: request_id
        window: count_based
        window_size: 60
contract:
  schema_version: 1
  version: 1.0.0
  visibility: public
  lifecycle: authored
  vendor_roles:
    paygrade:
      vendor_id: paygrade
      checkpoint: 0
      required_credentials:
      - PG_APP_TOKEN
      api_url_env: PAYGRADE_BASE_URL
      docs_url_env: PAYGRADE_DOCS_URL
  runtime:
    profile: deterministic-v1
    checkpoint: 0
    limits:
      wall_seconds: 3600
      cpus: 2
      memory: 2GiB
      disk: 2GiB
    network:
      vendor_roles:
      - paygrade
      model_provider_egress: mode-dependent-allowlist
    vendor_roles:
      paygrade:
        environment: {}
  participant:
    workspace_allowlist:
    - PROBLEM.md
    - repo/**
    - materials/**
    - inputs/**
    entry_command:
    - python
    - -m
    - paygrade_sync
    outputs:
    - output/employees.json
    - output/assignments.json
    - output/writeback_result.json
    persistent_state:
    - repo/output/**
    runtime_environment:
      INPUT_FILE: /app/input/pending_writes.json
    persistent_mounts: []
  verifier:
    entry_command:
    - python
    - -m
    - bench.verifier
    - --task
    - .
    trusted_inputs:
    - task.yaml
    - verifier/fixtures/**
    - verifier/scenarios/**
    - vendor-logs/**
