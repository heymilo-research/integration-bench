id: task-0039
title: Midnight split timesheet bridge
category: build
vendor: rosterly
surfaces:
- polling
- writeback
tier: 3
primary_mechanic: midnight_split_timesheet_bridge
track: python
timeout_minutes: 60
doc_profile: 'true'
scenarios:
- midnight_split_payroll_bridge
l3_scenarios: []
entry:
  command:
  - python
  - -m
  - harborpoint_bridge
outputs:
  files:
  - output/result.json
  - output/import_report.csv
  - output/writeback_log.json
vendors:
  rosterly:
    data_port: 8000
    log_path: /var/log/vendor
    checkpoint_env: CHECKPOINT
    credentials:
      RY_CLIENT_ID: rosterly-test-client_id
      RY_CLIENT_SECRET: rosterly-test-client_secret
    auth:
      token_endpoint: /oauth/token
      token_ttl: 3600
    vendor:
      base_path: /api
    entities:
      worker:
        plural: workers
      shift:
        plural: shifts
      interview:
        plural: interviews
    pagination:
      style: offset
      offset_param: offset
      limit_param: limit
      total_in_response: true
    writeback:
      endpoints:
      - method: POST
        path: /api/workers/{worker_id}/notes
        entity: note
      idempotency:
        header: Idempotency-Key
        window_s: 3600
status: authored
contract:
  schema_version: 1
  version: 1.0.0
  visibility: public
  lifecycle: authored
  vendor_roles:
    rosterly:
      vendor_id: rosterly
      checkpoint: 45
      required_credentials:
      - RY_CLIENT_ID
      - RY_CLIENT_SECRET
      api_url_env: ROSTERLY_BASE_URL
      docs_url_env: ROSTERLY_DOCS_URL
  runtime:
    profile: deterministic-v1
    checkpoint: 45
    limits:
      wall_seconds: 3600
      cpus: 2
      memory: 2GiB
      disk: 2GiB
    network:
      vendor_roles:
      - rosterly
      model_provider_egress: mode-dependent-allowlist
    vendor_roles:
      rosterly:
        environment: {}
  participant:
    workspace_allowlist:
    - PROBLEM.md
    - repo/**
    - materials/**
    - inputs/**
    entry_command:
    - python
    - -m
    - harborpoint_bridge
    outputs:
    - output/result.json
    - output/import_report.csv
    - output/writeback_log.json
    persistent_state:
    - repo/output/**
    runtime_environment:
      INPUT_FILE: /app/input/punches.csv
    persistent_mounts: []
  verifier:
    entry_command:
    - python
    - -m
    - bench.verifier
    - --task
    - .
    trusted_inputs:
    - task.yaml
    - verifier/fixtures/**
    - verifier/scenarios/**
    - vendor-logs/**
