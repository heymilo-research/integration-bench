[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "integration-bench-harness"
version = "0.1.0"
description = "Evaluation harness CLI for Integration-Bench (bench run/grade/validate)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "HeyMilo" }]

dependencies = [
  "PyYAML>=6.0",
  "httpx>=0.27",
  "psycopg[binary]>=3.1",
  "jsonschema>=4.23",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "ruff==0.12.12",
]
eval = [
  "httpx>=0.27",
  "python-dotenv>=1.0",
  "tiktoken==0.12.0",
]

[project.scripts]
bench = "bench.cli:main"

[tool.setuptools.packages.find]
include = ["bench*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["../docs/history", "../tools/migrations"]
