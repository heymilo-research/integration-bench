# Seed vocabulary for task.yaml's optional `primary_mechanic:` field.
#
# One line per slug, `slug: "description"`. `bench validate-suite` loads this
# file as the authoritative vocabulary: a task declaring a `primary_mechanic:`
# not listed here fails the lint (FAIL "unknown_mechanic"); a task with no
# `primary_mechanic:` at all only warns (WARN "undeclared_mechanic") since the
# field is new and backfilling it across the whole suite is a separate pass.
# Two tasks may never declare the SAME mechanic (FAIL "duplicate_mechanic") —
# the whole point of this vocabulary is one task per distinct "what makes this
# task hard" story, which is the suite's actual defense against clones: two
# tasks that are secretly the same exercise cannot both claim to be the
# unique thing that justifies their own existence.
#
# Add new slugs here as new tasks introduce genuinely new mechanics. Do not
# add a slug "just in case" — an unused slug is not a lint finding, but an
# ever-growing vocabulary nobody declares against is a sign this field isn't
# being maintained.

pagination_drift_convergence: "Pagination correctness under a live-shifting offset/cursor window that requires re-crawling until a full pass adds nothing new."
fault_composition_summit: "Multiple independent fault types stacked within a single scenario to test compounded resilience, not any one fault in isolation."
cross_vendor_allowlist_gate: "A cutover/migration gate that only allows traffic to the new vendor once an allowlist/parity condition is satisfied."
conflict_refetch_retry: "A write conflict is detected and the connector refetches and retries rather than blindly overwriting or silently dropping it."
rpc_over_200_errors: "The vendor's writeback RPC reports failure inside a 200-status response body instead of via an HTTP error status code."
hateoas_discovery_crawl: "Entity/collection URLs are discovered by following HATEOAS links rather than assumed from hardcoded paths."
oauth_token_death_midrun: "An OAuth token is invalidated mid-run and the connector must reauthenticate to keep making progress."
ooo_replay_convergence: "Out-of-order event replay must still converge on the same correct final state as in-order delivery."
v1_v2_sunset_migration: "A v1 API is sunset mid-task and the connector must migrate to v2 without losing or duplicating data."
cross_vendor_cutover_parity: "Migrating from one vendor to another with explicit parity checks across the cutover boundary."
body_only_429: "Rate limiting is signaled only in the response body (not the HTTP status code), so the connector must parse it to back off."
compounding_faults_summit: "Several distinct fault types compound within one run, testing cumulative rather than isolated resilience."
tombstone_timestamp_skew: "Deletion tombstones carry skewed or out-of-order timestamps that must still be reconciled correctly."
dropped_delete_reconcile: "A delete event is dropped or missed by the live channel and must be recovered via a reconciliation pass."
webhook_tamper_signing: "Webhook signature verification must reject tampered payloads without disrupting legitimate deliveries."
dual_timestamp_formats: "The vendor emits two different timestamp formats across surfaces that must both be parsed correctly."
local_time_branch_stamps: "The vendor stamps events in local (non-UTC) time, requiring correct timezone-aware handling."
refresh_rotation_persistence: "OAuth refresh tokens rotate on use and the rotated token must be persisted durably across restarts."
exactly_once_replay_restart: "A crash-and-restart during replay must not double-apply, or drop, any already-processed event."
precedence_reconciliation_lag: "Reconciliation must respect field-level precedence rules when catching up data that arrived out of order."
lag_500_after_commit: "The vendor returns a 500 shortly after a write commit, testing correct handling of an ambiguous write outcome."
split_brain_dual_versions: "Two divergent versions of the same entity exist simultaneously and must be reconciled to one answer."
sliding_window_etag_budget: "A sliding pagination window is bounded by an ETag-based budget rather than a plain offset/cursor."
booby_trapped_starter: "The starter repo/config ships a deliberate defect that must be found and fixed, not just extended."
cutover_gap_watermark: "A watermark gap opens during a vendor cutover and must be closed without losing data in the gap."
multi_status_207_lying_success: "A 207 multi-status response reports overall success while individual items inside it actually failed."
cursor_expiry_restart: "A pagination cursor expires mid-crawl and the connector must detect this and restart the crawl cleanly."
ack_body_webhooks_dlq: "Webhook acknowledgement depends on response body content, with failures routed to a dead-letter queue."
http_date_retry_after: "Retry-After is expressed as an HTTP-date rather than a delta-seconds integer and must be parsed as such."
hmac_clock_skew: "HMAC-signed webhook deliveries are time-boxed and must reject clock-skewed deliveries even with a valid signature."
one_based_pagination_clamp: "The vendor's pagination is 1-based and boundary pages must be clamped/handled correctly."
resume_not_restart_recovery: mid-crawl failure recovery must resume from the persisted watermark, made L1-visible rather than log-forensic

# Added during the 2026-08-01 undeclared_mechanic backfill pass (30 tasks).
poll_reconciliation_under_rate_limits: "A polling pass is the independent safety net for missed webhook deliveries, and must still converge correctly while operating under standard rate-limit backpressure."
webhook_duplicate_storm_idempotency: "A burst of duplicate/redelivered webhook events for the same change must collapse to a single applied effect, confirmed by a later reconciliation pass."
read_after_write_lag_no_double_create: "A just-created record does not yet appear in the read/list path used to check for its own existence, risking a duplicate create if that lag is mistaken for absence."
auth_mechanism_sunset_state_preservation: "A vendor sunsets its legacy auth mechanism for a new one mid-timeline, and already-built incremental sync state must survive the swap intact, not be reset."
omitted_cursor_infinite_loop_fix: "A polling loop mishandles a missing/omitted pagination cursor and spins or stalls instead of terminating or advancing correctly."
cross_vendor_id_only_webhook_provisioning: "An id-only webhook from one vendor must trigger exactly-once provisioning in a second, unrelated vendor, despite that second vendor's own read-after-write confirmation lag."
chained_write_partial_failure_idempotency: "A single logical write is actually a chain of multiple vendor calls, and a retry after a partial failure must not re-run a call that already landed nor skip one that didn't."
dual_timestamp_normalization_across_surfaces: "Two different timestamp wire formats must be normalized to canonical UTC consistently whether the record arrives via webhook or via polling."
rate_limit_gated_resume_convergence: "A large paginated backfill must resume from the exact failure point (not restart) while also honoring rate-limit backoff advice stacked on top of transient server errors."
phantom_delete_flag_detection: "Vendor documentation claims a deletion flag/field that does not actually exist; the connector must detect deletions via the real signal instead of trusting the doc."
poll_only_entities_unified_freshness: "Some entity types never receive webhook events at all and must be kept fresh purely by a recurring poll, unified with the entities that do get webhook coverage."
roster_backed_writeback_gate: "A cross-vendor write is gated on a third-party system-of-record's current roster state, not on the destination vendor's own allow-list or the caller's stale batch."
conflict_silently_accepted_as_success: "A write conflict or rejection from the vendor is incorrectly treated as a success by the connector, silently dropping the change instead of surfacing or retrying it."
broken_search_stub_list_fallback: "An advertised search/filter endpoint is an unimplemented stub, and the connector must fall back to a list-based crawl instead of relying on it."
absolute_refresh_expiry_doc_lie: "Docs describe the refresh-token window as sliding (renewed on each use) but the vendor actually enforces a fixed absolute expiry from initial issuance."
webhook_poll_mapping_shape_parity: "The webhook-apply path and the poll-apply path must share the same canonical mapping so a record ends up in an identical shape regardless of which path last touched it."
commit_on_event_not_202: "A writeback call's immediate 202-style response is not confirmation; the write is only genuinely committed once a later async event confirms it."
unified_rpc_gateway_reads_and_writes: "Every operation, reads and writes alike, is routed through a single RPC-style endpoint rather than a normal REST surface, including failure signaling and delete enumeration."
credential_leak_via_query_string: "A regression leaks an auth credential into a request's query string (and thus into logs) instead of confining it to headers/body where the vendor actually accepts it."
idempotency_window_retry_discipline: "The vendor's own idempotency/dedup guarantee for a retried write is only honored within a bounded replay window, and the connector must operate within that window rather than assume unlimited retry safety."
cross_vendor_delete_history_carryover: "A cutover to a new vendor must carry forward the old vendor's delete history under a namespaced legacy id, since the new vendor never knew the deleted record existed."
short_token_ttl_large_volume_backfill: "A very short-lived access token must be re-minted many times over the course of a single large-volume backfill without disrupting pagination continuity."
post_cutover_write_routing_exclusivity: "After a cutover, writes must target the new vendor exclusively and never reach the retired one, with a retried write reusing its original idempotency key rather than minting a fresh one."
offspec_fault_signals_403_and_body_429: "The vendor signals standard faults in non-standard places — token death as 403 rather than 401, and rate-limit advice in the response body rather than a Retry-After header — so a connector keyed to the conventional signals never notices either."

