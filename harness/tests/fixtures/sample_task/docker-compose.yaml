services:
  vendor:
    image: hm-swe-bench/vendorsim:fixture
    environment:
      VENDOR_ID: samplevendor
      SV_CLIENT_ID: sample-client-id
      SV_CLIENT_SECRET: sample-client-secret
      SV_WEBHOOK_SECRET: sample-webhook-secret
  app:
    image: hm-swe-bench/sample-app:fixture
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: bench
      POSTGRES_USER: bench
      POSTGRES_PASSWORD: bench
